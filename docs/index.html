<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portify - Portföy Takip Uygulaması</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #6366F1, #4F46E5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            color: white;
            padding: 40px;
        }
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 { font-size: 48px; margin-bottom: 16px; }
        p { font-size: 18px; opacity: 0.9; margin-bottom: 32px; }
        .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        a {
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border: 2px solid white;
            border-radius: 8px;
            transition: all 0.3s;
        }
        a:hover { background: white; color: #6366F1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📊</div>
        <h1>Portify</h1>
        <p>Yatırımlarını Tek Yerden Yönet</p>
        <div class="links">
            <a href="privacy-policy.html">Gizlilik Politikası</a>
            <a href="terms-of-service.html">Kullanım Koşulları</a>
        </div>
    </div>
</body>
</html>
